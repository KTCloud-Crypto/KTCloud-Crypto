name: Backend CI

on:
  workflow_call:
  push:
    branches:
      - develop
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - "docker-compose.production.yml"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches:
      - develop
      - main
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - "docker-compose.production.yml"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: fastapi_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fastapi_test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/fastapi_test_db
      SECRET_KEY: github-actions-test-secret
      MASTER_ENCRYPTION_KEY: ""

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 패키지 설치
        working-directory: backend
        run: pip install -r requirements.txt

      - name: DB 마이그레이션
        working-directory: backend
        run: alembic upgrade head

      - name: 모델과 DB 구조 비교
        working-directory: backend
        run: alembic check

      - name: 백엔드 테스트
        working-directory: backend
        run: python -m pytest -q

      - name: 백엔드 Docker 이미지 빌드
        run: docker build -t ktcloud-crypto-backend:ci ./backend
