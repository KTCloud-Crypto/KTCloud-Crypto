name: Release production

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: production-release
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  backend-ci:
    name: Verify backend
    uses: ./.github/workflows/backend-ci.yml

  frontend-ci:
    name: Verify frontend
    uses: ./.github/workflows/frontend-ci.yml

  release:
    name: Build and deploy
    needs:
      - backend-ci
      - frontend-ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      BACKEND_REPOSITORY: ${{ vars.ECR_BACKEND_REPOSITORY }}
      FRONTEND_REPOSITORY: ${{ vars.ECR_FRONTEND_REPOSITORY }}
      FRONTEND_S3_BUCKET: ${{ vars.FRONTEND_S3_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      DOCKER_PLATFORM: ${{ vars.DOCKER_PLATFORM || 'linux/amd64' }}

    steps:
      - name: Check out release
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release tag and source
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Production tags must follow vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "The release tag must point to a commit contained in main." >&2
            exit 1
          fi

      - name: Validate deployment configuration
        run: |
          set -euo pipefail
          : "${AWS_REGION:?Set the AWS_REGION production variable}"
          : "${AWS_ROLE_ARN:?Set the AWS_DEPLOY_ROLE_ARN production variable}"
          : "${BACKEND_REPOSITORY:?Set the ECR_BACKEND_REPOSITORY production variable}"
          : "${FRONTEND_REPOSITORY:?Set the ECR_FRONTEND_REPOSITORY production variable}"
          : "${FRONTEND_S3_BUCKET:?Set the FRONTEND_S3_BUCKET production variable}"
          : "${CLOUDFRONT_DISTRIBUTION_ID:?Set the CLOUDFRONT_DISTRIBUTION_ID production variable}"

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend static assets
        working-directory: frontend
        env:
          VITE_API_BASE_URL: /api
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Find existing backend release image
        id: backend_existing
        run: |
          set -euo pipefail
          digest="$(aws ecr describe-images \
            --repository-name "$BACKEND_REPOSITORY" \
            --image-ids "imageTag=$GITHUB_REF_NAME" \
            --query 'imageDetails[0].imageDigest' \
            --output text 2>/dev/null || true)"
          if [[ "$digest" == sha256:* ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push backend
        if: steps.backend_existing.outputs.exists != 'true'
        id: backend_build
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          platforms: ${{ env.DOCKER_PLATFORM }}
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.BACKEND_REPOSITORY }}:${{ github.ref_name }}
            ${{ steps.ecr.outputs.registry }}/${{ env.BACKEND_REPOSITORY }}:git-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          provenance: mode=max
          sbom: true

      - name: Find existing frontend release image
        id: frontend_existing
        run: |
          set -euo pipefail
          digest="$(aws ecr describe-images \
            --repository-name "$FRONTEND_REPOSITORY" \
            --image-ids "imageTag=$GITHUB_REF_NAME" \
            --query 'imageDetails[0].imageDigest' \
            --output text 2>/dev/null || true)"
          if [[ "$digest" == sha256:* ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push frontend
        if: steps.frontend_existing.outputs.exists != 'true'
        id: frontend_build
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          platforms: ${{ env.DOCKER_PLATFORM }}
          push: true
          build-args: |
            VITE_API_BASE_URL=/api
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.FRONTEND_REPOSITORY }}:${{ github.ref_name }}
            ${{ steps.ecr.outputs.registry }}/${{ env.FRONTEND_REPOSITORY }}:git-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          provenance: mode=max
          sbom: true

      - name: Publish frontend to S3 and refresh CloudFront
        run: |
          set -euo pipefail

          aws s3 sync frontend/dist "s3://$FRONTEND_S3_BUCKET" \
            --delete \
            --only-show-errors \
            --cache-control 'public,max-age=300'

          if [[ -d frontend/dist/assets ]]; then
            aws s3 cp frontend/dist/assets "s3://$FRONTEND_S3_BUCKET/assets" \
              --recursive \
              --only-show-errors \
              --cache-control 'public,max-age=31536000,immutable'
          fi

          aws s3 cp frontend/dist/index.html "s3://$FRONTEND_S3_BUCKET/index.html" \
            --only-show-errors \
            --cache-control 'no-cache,no-store,must-revalidate' \
            --content-type 'text/html; charset=utf-8'

          invalidation_id="$(aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths '/index.html' \
            --query 'Invalidation.Id' \
            --output text)"
          aws cloudfront wait invalidation-completed \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --id "$invalidation_id"
