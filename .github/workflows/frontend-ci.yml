name: Frontend CI

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v7

      - name: Node.js 설치
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 프론트엔드 패키지 설치
        working-directory: frontend
        run: npm ci

      - name: 프론트엔드 lint
        working-directory: frontend
        run: npm run lint

      - name: 프론트엔드 build
        working-directory: frontend
        run: npm run build

      - name: 프론트엔드 Docker 이미지 빌드
        run: docker build -t ktcloud-crypto-frontend:ci ./frontend

      - name: 프론트엔드 이미지 취약점 검사
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ktcloud-crypto-frontend:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
