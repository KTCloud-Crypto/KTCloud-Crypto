global:
  # A 30-second interval is sufficient for this single-host deployment and
  # halves the steady sample ingestion rate compared with the previous value.
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
  - job_name: strategy-worker
    static_configs:
      - targets: ["strategy-worker:9101"]
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
  - job_name: containers
    static_configs:
      - targets: ["cadvisor:8080"]
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]
