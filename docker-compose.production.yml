services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    profiles: ["tools"]
    environment: &backend-environment
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      UPBIT_API_BASE_URL: ${UPBIT_API_BASE_URL:-https://api.upbit.com}
      UPBIT_WS_URL: ${UPBIT_WS_URL:-wss://api.upbit.com/websocket/v1}
      WATCH_MARKETS: ${WATCH_MARKETS:-KRW-BTC,KRW-ETH,KRW-XRP,KRW-SOL,KRW-DOGE,KRW-TRX}
      STRATEGY_REFRESH_SECONDS: ${STRATEGY_REFRESH_SECONDS:-30}
      LIVE_TRADING_ENABLED: ${LIVE_TRADING_ENABLED:-false}
      ENVIRONMENT: ${ENVIRONMENT:?ENVIRONMENT is required}
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY:?MASTER_ENCRYPTION_KEY is required}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-signaltrade.cloud,localhost,127.0.0.1,backend}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://signaltrade.cloud}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      POSITION_RECONCILIATION_SECONDS: ${POSITION_RECONCILIATION_SECONDS:-60}
      STALE_EXECUTION_SECONDS: ${STALE_EXECUTION_SECONDS:-120}
    depends_on:
      db:
        condition: service_healthy
    command: alembic upgrade head
    restart: "no"

  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    restart: unless-stopped
    environment: *backend-environment
    depends_on:
      db:
        condition: service_healthy

  strategy-worker:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    restart: unless-stopped
    environment: *backend-environment
    depends_on:
      backend:
        condition: service_healthy
    command: python -m app.workers.runtime
    healthcheck:
      disable: true

  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE is required}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
      HTTPS_ENABLED: ${HTTPS_ENABLED:-true}
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - certbot_www:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro

  certbot:
    image: certbot/certbot:latest
    profiles: ["tls"]
    volumes:
      - certbot_www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt

volumes:
  postgres_data:
  certbot_www:
  letsencrypt:
