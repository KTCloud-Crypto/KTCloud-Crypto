apiVersion: apps/v1
kind: Deployment
metadata: {name: notification-worker, namespace: signaltrade}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app.kubernetes.io/name: notification-worker}}
  template:
    metadata: {labels: {app.kubernetes.io/name: notification-worker, app.kubernetes.io/part-of: signaltrade}}
    spec:
      terminationGracePeriodSeconds: 90
      containers:
        - name: notification-worker
          image: signaltrade-backend:local
          imagePullPolicy: Never
          command: ["python", "-m", "app.notification.worker"]
          envFrom:
            - configMapRef: {name: application-runtime-config}
            - secretRef: {name: application-runtime-secret}
          resources: {requests: {cpu: 25m, memory: 96Mi}, limits: {cpu: 500m, memory: 384Mi}}
