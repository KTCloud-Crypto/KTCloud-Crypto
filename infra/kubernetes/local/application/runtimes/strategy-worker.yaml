apiVersion: apps/v1
kind: Deployment
metadata: {name: strategy-worker, namespace: signaltrade}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app.kubernetes.io/name: strategy-worker}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: strategy-worker, app.kubernetes.io/part-of: signaltrade}
      annotations: {prometheus.io/scrape: "true", prometheus.io/path: /metrics, prometheus.io/port: "9101"}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: strategy-worker
          image: signaltrade-backend:local
          imagePullPolicy: Never
          command: ["python", "-m", "app.strategy.worker"]
          envFrom: &worker-env
            - configMapRef: {name: application-runtime-config}
            - secretRef: {name: application-runtime-secret}
          ports: [{name: metrics, containerPort: 9101}]
          resources: &worker-resources
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
