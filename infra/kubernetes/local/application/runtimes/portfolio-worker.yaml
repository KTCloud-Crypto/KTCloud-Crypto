apiVersion: apps/v1
kind: Deployment
metadata: {name: portfolio-worker, namespace: signaltrade}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app.kubernetes.io/name: portfolio-worker}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: portfolio-worker, app.kubernetes.io/part-of: signaltrade}
      annotations: {prometheus.io/scrape: "true", prometheus.io/path: /metrics, prometheus.io/port: "9103"}
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: portfolio-worker
          image: signaltrade-backend:local
          imagePullPolicy: Never
          command: ["python", "-m", "app.portfolio.worker"]
          envFrom:
            - configMapRef: {name: application-runtime-config}
            - secretRef: {name: application-runtime-secret}
          ports: [{name: metrics, containerPort: 9103}]
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: "1", memory: 512Mi}}
