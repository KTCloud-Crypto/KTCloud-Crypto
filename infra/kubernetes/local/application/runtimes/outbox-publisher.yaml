apiVersion: apps/v1
kind: Deployment
metadata: {name: outbox-publisher, namespace: signaltrade}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app.kubernetes.io/name: outbox-publisher}}
  template:
    metadata: {labels: {app.kubernetes.io/name: outbox-publisher, app.kubernetes.io/part-of: signaltrade}}
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: outbox-publisher
          image: signaltrade-backend:local
          imagePullPolicy: Never
          command: ["python", "-m", "app.workers.outbox_publisher_runtime"]
          envFrom:
            - configMapRef: {name: application-runtime-config}
            - secretRef: {name: application-runtime-secret}
          resources: {requests: {cpu: 25m, memory: 96Mi}, limits: {cpu: 500m, memory: 384Mi}}
