AWSTemplateFormatVersion: "2010-09-09"
Description: 기존 VPC를 사용하는 SignalTrade EKS 네트워크 및 관리형 노드 그룹 기반 구성

Parameters:
  ClusterName:
    Type: String
    Default: signaltrade-staging
    AllowedPattern: "^[A-Za-z0-9][A-Za-z0-9_-]{0,99}$"
  KubernetesVersion:
    Type: String
    Default: "1.35"
    AllowedValues: ["1.35", "1.36"]
  ExistingVpcId:
    Type: AWS::EC2::VPC::Id
    Default: vpc-09cc728728da18588
  ExistingInternetGatewayId:
    Type: String
    Default: igw-04f39b37e258a32c4
  ExistingRdsSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Default: sg-0a992f5fefb9e1c71
  ExistingApplicationSecretArn:
    Type: String
    Default: arn:aws:secretsmanager:us-east-1:832496385575:secret:signaltrade/production-54wwPv
    Description: External Secrets Operator가 읽을 기존 Secrets Manager Secret ARN입니다.
  AvailabilityZoneA:
    Type: AWS::EC2::AvailabilityZone::Name
    Default: us-east-1a
  AvailabilityZoneB:
    Type: AWS::EC2::AvailabilityZone::Name
    Default: us-east-1b
  PublicSubnetACidr:
    Type: String
    Default: 172.31.98.0/24
  PublicSubnetBCidr:
    Type: String
    Default: 172.31.99.0/24
  PrivateSubnetACidr:
    Type: String
    Default: 172.31.112.0/20
  PrivateSubnetBCidr:
    Type: String
    Default: 172.31.128.0/20
  AllowedKubectlCidr:
    Type: String
    Description: Kubernetes API 접근을 허용할 공인 IPv4 CIDR입니다. 예시는 203.0.113.10/32입니다.
    AllowedPattern: "^(?:[0-9]{1,3}\\.){3}[0-9]{1,3}/(?:[0-9]|[12][0-9]|3[0-2])$"
  NatGatewayMode:
    Type: String
    Default: Single
    AllowedValues: [Single, HighlyAvailable]
    Description: Single은 NAT Gateway 1개를 사용하고 HighlyAvailable은 AZ마다 1개를 생성합니다.
  NodeInstanceTypes:
    Type: CommaDelimitedList
    Default: t3.small
  NodeDesiredSize:
    Type: Number
    Default: 2
    MinValue: 2
  NodeMinimumSize:
    Type: Number
    Default: 2
    MinValue: 2
  NodeMaximumSize:
    Type: Number
    Default: 4
    MinValue: 2
  NodeDiskSizeGiB:
    Type: Number
    Default: 20
    MinValue: 20
Conditions:
  UseHighlyAvailableNat: !Equals [!Ref NatGatewayMode, HighlyAvailable]
  UseSingleNat: !Equals [!Ref NatGatewayMode, Single]

Resources:
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref ExistingVpcId
      AvailabilityZone: !Ref AvailabilityZoneA
      CidrBlock: !Ref PublicSubnetACidr
      MapPublicIpOnLaunch: true
      Tags:
        - {Key: Name, Value: !Sub "${ClusterName}-public-a"}
        - {Key: kubernetes.io/role/elb, Value: "1"}
        - {Key: !Sub "kubernetes.io/cluster/${ClusterName}", Value: shared}

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref ExistingVpcId
      AvailabilityZone: !Ref AvailabilityZoneB
      CidrBlock: !Ref PublicSubnetBCidr
      MapPublicIpOnLaunch: true
      Tags:
        - {Key: Name, Value: !Sub "${ClusterName}-public-b"}
        - {Key: kubernetes.io/role/elb, Value: "1"}
        - {Key: !Sub "kubernetes.io/cluster/${ClusterName}", Value: shared}

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref ExistingVpcId
      AvailabilityZone: !Ref AvailabilityZoneA
      CidrBlock: !Ref PrivateSubnetACidr
      MapPublicIpOnLaunch: false
      Tags:
        - {Key: Name, Value: !Sub "${ClusterName}-private-a"}
        - {Key: kubernetes.io/role/internal-elb, Value: "1"}
        - {Key: !Sub "kubernetes.io/cluster/${ClusterName}", Value: shared}

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref ExistingVpcId
      AvailabilityZone: !Ref AvailabilityZoneB
      CidrBlock: !Ref PrivateSubnetBCidr
      MapPublicIpOnLaunch: false
      Tags:
        - {Key: Name, Value: !Sub "${ClusterName}-private-b"}
        - {Key: kubernetes.io/role/internal-elb, Value: "1"}
        - {Key: !Sub "kubernetes.io/cluster/${ClusterName}", Value: shared}

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref ExistingVpcId
      Tags:
        - {Key: Name, Value: !Sub "${ClusterName}-public"}

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref ExistingInternetGatewayId

  PublicSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnetA

  PublicSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnetB

  NatEipA:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - {Key: Name, Value: !Sub "${ClusterName}-nat-a"}

  NatGatewayA:
    Type: AWS::EC2::NatGateway
    DependsOn: PublicDefaultRoute
    Properties:
      AllocationId: !GetAtt NatEipA.AllocationId
      SubnetId: !Ref PublicSubnetA
      Tags:
        - {Key: Name, Value: !Sub "${ClusterName}-nat-a"}

  NatEipB:
    Type: AWS::EC2::EIP
    Condition: UseHighlyAvailableNat
    Properties:
      Domain: vpc
      Tags:
        - {Key: Name, Value: !Sub "${ClusterName}-nat-b"}

  NatGatewayB:
    Type: AWS::EC2::NatGateway
    Condition: UseHighlyAvailableNat
    DependsOn: PublicDefaultRoute
    Properties:
      AllocationId: !GetAtt NatEipB.AllocationId
      SubnetId: !Ref PublicSubnetB
      Tags:
        - {Key: Name, Value: !Sub "${ClusterName}-nat-b"}

  PrivateRouteTableA:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref ExistingVpcId
      Tags:
        - {Key: Name, Value: !Sub "${ClusterName}-private-a"}

  PrivateRouteTableB:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref ExistingVpcId
      Tags:
        - {Key: Name, Value: !Sub "${ClusterName}-private-b"}

  PrivateDefaultRouteA:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTableA
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGatewayA

  PrivateDefaultRouteBHighlyAvailable:
    Type: AWS::EC2::Route
    Condition: UseHighlyAvailableNat
    Properties:
      RouteTableId: !Ref PrivateRouteTableB
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGatewayB

  PrivateDefaultRouteBSingle:
    Type: AWS::EC2::Route
    Condition: UseSingleNat
    Properties:
      RouteTableId: !Ref PrivateRouteTableB
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGatewayA

  PrivateSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTableA
      SubnetId: !Ref PrivateSubnetA

  PrivateSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTableB
      SubnetId: !Ref PrivateSubnetB

  EksClusterRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ClusterName}-cluster-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: eks.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSClusterPolicy
      Tags:
        - {Key: Project, Value: SignalTrade}
        - {Key: Environment, Value: staging}

  EksNodeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ClusterName}-node-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryPullOnly
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - {Key: Project, Value: SignalTrade}
        - {Key: Environment, Value: staging}

  PodIdentityRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ClusterName}-pod-identity-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: pods.eks.amazonaws.com}
            Action: [sts:AssumeRole, sts:TagSession]

  VpcCniPolicyAttachment:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: VpcCni
      Roles: [!Ref PodIdentityRole]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - ec2:AssignPrivateIpAddresses
              - ec2:AttachNetworkInterface
              - ec2:CreateNetworkInterface
              - ec2:DeleteNetworkInterface
              - ec2:DescribeInstances
              - ec2:DescribeTags
              - ec2:DescribeNetworkInterfaces
              - ec2:DescribeInstanceTypes
              - ec2:DescribeSubnets
              - ec2:DetachNetworkInterface
              - ec2:ModifyNetworkInterfaceAttribute
            Resource: "*"
          - Effect: Allow
            Action: ec2:CreateTags
            Resource: arn:aws:ec2:*:*:network-interface/*

  EbsCsiRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ClusterName}-ebs-csi-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: pods.eks.amazonaws.com}
            Action: [sts:AssumeRole, sts:TagSession]
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEBSCSIDriverPolicy

  AwsLoadBalancerControllerPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${ClusterName}-aws-load-balancer-controller"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: iam:CreateServiceLinkedRole
            Resource: "*"
            Condition:
              StringEquals:
                iam:AWSServiceName: elasticloadbalancing.amazonaws.com
          - Effect: Allow
            Action:
              - ec2:DescribeAccountAttributes
              - ec2:DescribeAddresses
              - ec2:DescribeAvailabilityZones
              - ec2:DescribeInternetGateways
              - ec2:DescribeVpcs
              - ec2:DescribeVpcPeeringConnections
              - ec2:DescribeSubnets
              - ec2:DescribeSecurityGroups
              - ec2:DescribeInstances
              - ec2:DescribeNetworkInterfaces
              - ec2:DescribeTags
              - ec2:GetCoipPoolUsage
              - ec2:DescribeCoipPools
              - ec2:GetSecurityGroupsForVpc
              - ec2:DescribeIpamPools
              - ec2:DescribeRouteTables
              - elasticloadbalancing:DescribeLoadBalancers
              - elasticloadbalancing:DescribeLoadBalancerAttributes
              - elasticloadbalancing:DescribeListeners
              - elasticloadbalancing:DescribeListenerCertificates
              - elasticloadbalancing:DescribeSSLPolicies
              - elasticloadbalancing:DescribeRules
              - elasticloadbalancing:DescribeTargetGroups
              - elasticloadbalancing:DescribeTargetGroupAttributes
              - elasticloadbalancing:DescribeTargetHealth
              - elasticloadbalancing:DescribeTags
              - elasticloadbalancing:DescribeTrustStores
              - elasticloadbalancing:DescribeListenerAttributes
              - elasticloadbalancing:DescribeCapacityReservation
            Resource: "*"
          - Effect: Allow
            Action:
              - cognito-idp:DescribeUserPoolClient
              - acm:ListCertificates
              - acm:DescribeCertificate
              - iam:ListServerCertificates
              - iam:GetServerCertificate
              - waf-regional:GetWebACL
              - waf-regional:GetWebACLForResource
              - waf-regional:AssociateWebACL
              - waf-regional:DisassociateWebACL
              - wafv2:GetWebACL
              - wafv2:GetWebACLForResource
              - wafv2:AssociateWebACL
              - wafv2:DisassociateWebACL
              - shield:GetSubscriptionState
              - shield:DescribeProtection
              - shield:CreateProtection
              - shield:DeleteProtection
            Resource: "*"
          - Effect: Allow
            Action: [ec2:AuthorizeSecurityGroupIngress, ec2:RevokeSecurityGroupIngress]
            Resource: "*"
          - Effect: Allow
            Action: ec2:CreateSecurityGroup
            Resource: "*"
          - Effect: Allow
            Action: ec2:CreateTags
            Resource: arn:aws:ec2:*:*:security-group/*
            Condition:
              StringEquals: {"ec2:CreateAction": CreateSecurityGroup}
              "Null": {"aws:RequestTag/elbv2.k8s.aws/cluster": "false"}
          - Effect: Allow
            Action: [ec2:CreateTags, ec2:DeleteTags]
            Resource: arn:aws:ec2:*:*:security-group/*
            Condition:
              "Null":
                "aws:RequestTag/elbv2.k8s.aws/cluster": "true"
                "aws:ResourceTag/elbv2.k8s.aws/cluster": "false"
          - Effect: Allow
            Action: [ec2:AuthorizeSecurityGroupIngress, ec2:RevokeSecurityGroupIngress, ec2:DeleteSecurityGroup]
            Resource: "*"
            Condition:
              "Null": {"aws:ResourceTag/elbv2.k8s.aws/cluster": "false"}
          - Effect: Allow
            Action: [elasticloadbalancing:CreateLoadBalancer, elasticloadbalancing:CreateTargetGroup]
            Resource: "*"
            Condition:
              "Null": {"aws:RequestTag/elbv2.k8s.aws/cluster": "false"}
          - Effect: Allow
            Action:
              - elasticloadbalancing:CreateListener
              - elasticloadbalancing:DeleteListener
              - elasticloadbalancing:CreateRule
              - elasticloadbalancing:DeleteRule
            Resource: "*"
          - Effect: Allow
            Action: [elasticloadbalancing:AddTags, elasticloadbalancing:RemoveTags]
            Resource:
              - arn:aws:elasticloadbalancing:*:*:targetgroup/*/*
              - arn:aws:elasticloadbalancing:*:*:loadbalancer/net/*/*
              - arn:aws:elasticloadbalancing:*:*:loadbalancer/app/*/*
            Condition:
              "Null":
                "aws:RequestTag/elbv2.k8s.aws/cluster": "true"
                "aws:ResourceTag/elbv2.k8s.aws/cluster": "false"
          - Effect: Allow
            Action: [elasticloadbalancing:AddTags, elasticloadbalancing:RemoveTags]
            Resource:
              - arn:aws:elasticloadbalancing:*:*:listener/net/*/*/*
              - arn:aws:elasticloadbalancing:*:*:listener/app/*/*/*
              - arn:aws:elasticloadbalancing:*:*:listener-rule/net/*/*/*
              - arn:aws:elasticloadbalancing:*:*:listener-rule/app/*/*/*
          - Effect: Allow
            Action:
              - elasticloadbalancing:ModifyLoadBalancerAttributes
              - elasticloadbalancing:SetIpAddressType
              - elasticloadbalancing:SetSecurityGroups
              - elasticloadbalancing:SetSubnets
              - elasticloadbalancing:DeleteLoadBalancer
              - elasticloadbalancing:ModifyTargetGroup
              - elasticloadbalancing:ModifyTargetGroupAttributes
              - elasticloadbalancing:DeleteTargetGroup
              - elasticloadbalancing:ModifyListenerAttributes
              - elasticloadbalancing:ModifyCapacityReservation
              - elasticloadbalancing:ModifyIpPools
            Resource: "*"
            Condition:
              "Null": {"aws:ResourceTag/elbv2.k8s.aws/cluster": "false"}
          - Effect: Allow
            Action: elasticloadbalancing:AddTags
            Resource:
              - arn:aws:elasticloadbalancing:*:*:targetgroup/*/*
              - arn:aws:elasticloadbalancing:*:*:loadbalancer/net/*/*
              - arn:aws:elasticloadbalancing:*:*:loadbalancer/app/*/*
            Condition:
              StringEquals:
                "elasticloadbalancing:CreateAction": [CreateTargetGroup, CreateLoadBalancer]
              "Null": {"aws:RequestTag/elbv2.k8s.aws/cluster": "false"}
          - Effect: Allow
            Action: [elasticloadbalancing:RegisterTargets, elasticloadbalancing:DeregisterTargets]
            Resource: arn:aws:elasticloadbalancing:*:*:targetgroup/*/*
          - Effect: Allow
            Action:
              - elasticloadbalancing:SetWebAcl
              - elasticloadbalancing:ModifyListener
              - elasticloadbalancing:AddListenerCertificates
              - elasticloadbalancing:RemoveListenerCertificates
              - elasticloadbalancing:ModifyRule
              - elasticloadbalancing:SetRulePriorities
            Resource: "*"

  AwsLoadBalancerControllerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ClusterName}-aws-load-balancer-controller"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: pods.eks.amazonaws.com}
            Action: [sts:AssumeRole, sts:TagSession]
      ManagedPolicyArns: [!Ref AwsLoadBalancerControllerPolicy]
      Tags:
        - {Key: Project, Value: SignalTrade}
        - {Key: Environment, Value: staging}

  ExternalSecretsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ClusterName}-external-secrets"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: pods.eks.amazonaws.com}
            Action: [sts:AssumeRole, sts:TagSession]
      Policies:
        - PolicyName: ReadSignalTradeApplicationSecret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                Resource: !Ref ExistingApplicationSecretArn
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:GetParametersByPath
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/signaltrade/production/monitoring/*"
      Tags:
        - {Key: Project, Value: SignalTrade}
        - {Key: Environment, Value: staging}

  EksCluster:
    Type: AWS::EKS::Cluster
    Properties:
      Name: !Ref ClusterName
      Version: !Ref KubernetesVersion
      RoleArn: !GetAtt EksClusterRole.Arn
      AccessConfig:
        AuthenticationMode: API_AND_CONFIG_MAP
        BootstrapClusterCreatorAdminPermissions: true
      BootstrapSelfManagedAddons: false
      KubernetesNetworkConfig:
        IpFamily: ipv4
        ServiceIpv4Cidr: 10.100.0.0/16
      Logging:
        ClusterLogging:
          EnabledTypes: []
      ResourcesVpcConfig:
        EndpointPrivateAccess: true
        EndpointPublicAccess: true
        PublicAccessCidrs: [!Ref AllowedKubectlCidr]
        SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      Tags:
        - {Key: Project, Value: SignalTrade}
        - {Key: Environment, Value: staging}

  PodIdentityAgentAddon:
    Type: AWS::EKS::Addon
    Properties:
      AddonName: eks-pod-identity-agent
      ClusterName: !Ref EksCluster
      ResolveConflicts: OVERWRITE

  VpcCniAssociation:
    Type: AWS::EKS::PodIdentityAssociation
    DependsOn: [PodIdentityAgentAddon, VpcCniPolicyAttachment]
    Properties:
      ClusterName: !Ref EksCluster
      Namespace: kube-system
      ServiceAccount: aws-node
      RoleArn: !GetAtt PodIdentityRole.Arn

  EbsCsiAssociation:
    Type: AWS::EKS::PodIdentityAssociation
    DependsOn: PodIdentityAgentAddon
    Properties:
      ClusterName: !Ref EksCluster
      Namespace: kube-system
      ServiceAccount: ebs-csi-controller-sa
      RoleArn: !GetAtt EbsCsiRole.Arn

  AwsLoadBalancerControllerAssociation:
    Type: AWS::EKS::PodIdentityAssociation
    DependsOn: PodIdentityAgentAddon
    Properties:
      ClusterName: !Ref EksCluster
      Namespace: kube-system
      ServiceAccount: aws-load-balancer-controller
      RoleArn: !GetAtt AwsLoadBalancerControllerRole.Arn

  ExternalSecretsAssociation:
    Type: AWS::EKS::PodIdentityAssociation
    DependsOn: PodIdentityAgentAddon
    Properties:
      ClusterName: !Ref EksCluster
      Namespace: external-secrets
      ServiceAccount: external-secrets
      RoleArn: !GetAtt ExternalSecretsRole.Arn

  VpcCniAddon:
    Type: AWS::EKS::Addon
    DependsOn: VpcCniAssociation
    Properties:
      AddonName: vpc-cni
      ClusterName: !Ref EksCluster
      ConfigurationValues: '{"enableNetworkPolicy":"true"}'
      ResolveConflicts: OVERWRITE

  KubeProxyAddon:
    Type: AWS::EKS::Addon
    Properties:
      AddonName: kube-proxy
      ClusterName: !Ref EksCluster
      ResolveConflicts: OVERWRITE

  CoreDnsAddon:
    Type: AWS::EKS::Addon
    Properties:
      AddonName: coredns
      ClusterName: !Ref EksCluster
      ResolveConflicts: OVERWRITE

  EbsCsiAddon:
    Type: AWS::EKS::Addon
    DependsOn: EbsCsiAssociation
    Properties:
      AddonName: aws-ebs-csi-driver
      ClusterName: !Ref EksCluster
      ResolveConflicts: OVERWRITE

  ManagedNodeGroup:
    Type: AWS::EKS::Nodegroup
    DependsOn: [VpcCniAddon, KubeProxyAddon, CoreDnsAddon, PrivateDefaultRouteA]
    Properties:
      ClusterName: !Ref EksCluster
      NodegroupName: system-apps-small
      NodeRole: !GetAtt EksNodeRole.Arn
      AmiType: AL2023_x86_64_STANDARD
      CapacityType: ON_DEMAND
      DiskSize: !Ref NodeDiskSizeGiB
      InstanceTypes: !Ref NodeInstanceTypes
      Subnets: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      ScalingConfig:
        DesiredSize: !Ref NodeDesiredSize
        MinSize: !Ref NodeMinimumSize
        MaxSize: !Ref NodeMaximumSize
      UpdateConfig:
        MaxUnavailable: 1
      NodeRepairConfig:
        Enabled: true
      Labels:
        workload: general
      Tags:
        Project: SignalTrade
        Environment: staging

  RdsIngressFromEksClusterSecurityGroup:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ExistingRdsSecurityGroupId
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !GetAtt EksCluster.ClusterSecurityGroupId
      Description: PostgreSQL from SignalTrade EKS nodes and pods

Outputs:
  ClusterName:
    Value: !Ref EksCluster
  ClusterArn:
    Value: !GetAtt EksCluster.Arn
  ClusterEndpoint:
    Value: !GetAtt EksCluster.Endpoint
  ClusterSecurityGroupId:
    Value: !GetAtt EksCluster.ClusterSecurityGroupId
  PublicSubnetIds:
    Value: !Join [",", [!Ref PublicSubnetA, !Ref PublicSubnetB]]
  PrivateSubnetIds:
    Value: !Join [",", [!Ref PrivateSubnetA, !Ref PrivateSubnetB]]
  NatPublicIpA:
    Value: !Ref NatEipA
    Description: Single NAT 모드에서 Upbit 허용 IP로 등록할 EKS 고정 외부 IP입니다.
  NatPublicIpB:
    Condition: UseHighlyAvailableNat
    Value: !Ref NatEipB
  NodeRoleArn:
    Value: !GetAtt EksNodeRole.Arn
  EbsCsiRoleArn:
    Value: !GetAtt EbsCsiRole.Arn
  AwsLoadBalancerControllerRoleArn:
    Value: !GetAtt AwsLoadBalancerControllerRole.Arn
  ExternalSecretsRoleArn:
    Value: !GetAtt ExternalSecretsRole.Arn
