apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: alloy, namespace: signaltrade-staging}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: signaltrade-alloy-pod-logs}
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, namespaces]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: signaltrade-alloy-pod-logs}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: signaltrade-alloy-pod-logs}
subjects:
  - {kind: ServiceAccount, name: alloy, namespace: signaltrade-staging}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: prometheus-config, namespace: signaltrade-staging}
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      evaluation_interval: 30s
    scrape_configs:
      - job_name: backend
        static_configs: [{targets: ["backend:80"]}]
      - job_name: strategy-worker
        static_configs: [{targets: ["strategy-worker:9101"]}]
      - job_name: postgres
        static_configs: [{targets: ["postgres-exporter:9187"]}]
      - job_name: prometheus
        static_configs: [{targets: ["prometheus:9090"]}]
      - job_name: loki
        static_configs: [{targets: ["loki:3100"]}]
      - job_name: alloy
        static_configs: [{targets: ["alloy:12345"]}]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: loki-config, namespace: signaltrade-staging}
data:
  loki.yml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
    common:
      path_prefix: /loki
      replication_factor: 1
      ring:
        instance_addr: 127.0.0.1
        kvstore: {store: inmemory}
    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index: {prefix: index_, period: 24h}
    storage_config:
      filesystem: {directory: /loki/chunks}
    compactor:
      working_directory: /loki/compactor
      retention_enabled: true
      delete_request_store: filesystem
    limits_config:
      retention_period: 336h
      allow_structured_metadata: true
    analytics: {reporting_enabled: false}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: grafana-provisioning, namespace: signaltrade-staging}
data:
  datasources.yml: |
    apiVersion: 1
    deleteDatasources:
      - {name: Prometheus Legacy EC2, orgId: 1}
      - {name: Loki Legacy EC2, orgId: 1}
    datasources:
      - {name: Prometheus, uid: prometheus, type: prometheus, access: proxy, url: "http://prometheus:9090", isDefault: true}
      - {name: Loki, uid: loki, type: loki, access: proxy, url: "http://loki:3100"}
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: SignalTrade
        folder: SignalTrade
        type: file
        options: {path: /var/lib/grafana/dashboards}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: alloy-config, namespace: signaltrade-staging}
data:
  config.alloy: |
    discovery.kubernetes "pods" {
      role = "pod"
    }
    discovery.relabel "signaltrade_pods" {
      targets = discovery.kubernetes.pods.targets
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        regex = "signaltrade-staging"
        action = "keep"
      }
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label = "container"
      }
    }
    loki.source.kubernetes "signaltrade_pods" {
      targets = discovery.relabel.signaltrade_pods.output
      forward_to = [loki.process.pod_logs.receiver]
    }
    loki.process "pod_logs" {
      stage.json {
        expressions = {level = "level", log_type = "log_type", service = "service", environment = "environment"}
      }
      stage.labels {
        values = {level = "", log_type = "", service = "", environment = ""}
      }
      forward_to = [loki.write.local.receiver]
    }
    loki.write "local" {
      endpoint {url = "http://loki:3100/loki/api/v1/push"}
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: prometheus-data, namespace: signaltrade-staging}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: gp3
  resources: {requests: {storage: 10Gi}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: loki-data, namespace: signaltrade-staging}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: gp3
  resources: {requests: {storage: 10Gi}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: grafana-data, namespace: signaltrade-staging}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: gp3
  resources: {requests: {storage: 5Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: prometheus, namespace: signaltrade-staging}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app.kubernetes.io/name: prometheus}}
  template:
    metadata: {labels: {app.kubernetes.io/name: prometheus}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65534, runAsGroup: 65534, fsGroup: 65534, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: prometheus
          image: prom/prometheus:v3.8.1
          args: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=14d", "--storage.tsdb.retention.size=2GB"]
          ports: [{name: http, containerPort: 9090}]
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus, readOnly: true}
            - {name: data, mountPath: /prometheus}
            - {name: tmp, mountPath: /tmp}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          readinessProbe: {httpGet: {path: /-/ready, port: http}, initialDelaySeconds: 5, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /-/healthy, port: http}, initialDelaySeconds: 15, periodSeconds: 30}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: 500m, memory: 512Mi}}
      volumes:
        - {name: config, configMap: {name: prometheus-config}}
        - {name: data, persistentVolumeClaim: {claimName: prometheus-data}}
        - {name: tmp, emptyDir: {medium: Memory, sizeLimit: 64Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: prometheus, namespace: signaltrade-staging}
spec: {selector: {app.kubernetes.io/name: prometheus}, ports: [{name: http, port: 9090, targetPort: http}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: loki, namespace: signaltrade-staging}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app.kubernetes.io/name: loki}}
  template:
    metadata: {labels: {app.kubernetes.io/name: loki}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: loki
          image: grafana/loki:3.7.3
          args: ["-config.file=/etc/loki/loki.yml"]
          ports: [{name: http, containerPort: 3100}]
          volumeMounts:
            - {name: config, mountPath: /etc/loki, readOnly: true}
            - {name: data, mountPath: /loki}
            - {name: tmp, mountPath: /tmp}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          readinessProbe: {httpGet: {path: /ready, port: http}, initialDelaySeconds: 10, periodSeconds: 10}
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: 300m, memory: 384Mi}}
      volumes:
        - {name: config, configMap: {name: loki-config}}
        - {name: data, persistentVolumeClaim: {claimName: loki-data}}
        - {name: tmp, emptyDir: {medium: Memory, sizeLimit: 64Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: loki, namespace: signaltrade-staging}
spec: {selector: {app.kubernetes.io/name: loki}, ports: [{name: http, port: 3100, targetPort: http}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: grafana, namespace: signaltrade-staging}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app.kubernetes.io/name: grafana}}
  template:
    metadata: {labels: {app.kubernetes.io/name: grafana}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 472, runAsGroup: 472, fsGroup: 472, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: grafana
          image: grafana/grafana:12.3.1
          ports: [{name: http, containerPort: 3000}]
          env:
            - {name: GF_USERS_ALLOW_SIGN_UP, value: "false"}
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "false"}
            - {name: GF_SERVER_ROOT_URL, value: "https://signaltrade.cloud/monitoring/"}
            - {name: GF_SERVER_SERVE_FROM_SUB_PATH, value: "true"}
            - {name: GF_SECURITY_ADMIN_USER, valueFrom: {secretKeyRef: {name: monitoring, key: GRAFANA_ADMIN_USER}}}
            - {name: GF_SECURITY_ADMIN_PASSWORD, valueFrom: {secretKeyRef: {name: monitoring, key: GRAFANA_ADMIN_PASSWORD}}}
          volumeMounts:
            - {name: data, mountPath: /var/lib/grafana}
            - {name: provisioning, mountPath: /etc/grafana/provisioning/datasources/datasources.yml, subPath: datasources.yml, readOnly: true}
            - {name: provisioning, mountPath: /etc/grafana/provisioning/dashboards/dashboards.yml, subPath: dashboards.yml, readOnly: true}
            - {name: dashboards, mountPath: /var/lib/grafana/dashboards, readOnly: true}
            - {name: tmp, mountPath: /tmp}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          readinessProbe: {httpGet: {path: /monitoring/api/health, port: http}, initialDelaySeconds: 10, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /monitoring/api/health, port: http}, initialDelaySeconds: 30, periodSeconds: 30}
          resources: {requests: {cpu: 50m, memory: 160Mi}, limits: {cpu: 300m, memory: 384Mi}}
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: grafana-data}}
        - {name: provisioning, configMap: {name: grafana-provisioning}}
        - {name: dashboards, configMap: {name: grafana-dashboards, optional: true}}
        - {name: tmp, emptyDir: {medium: Memory, sizeLimit: 64Mi}}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: signaltrade-staging
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /monitoring/api/health
    alb.ingress.kubernetes.io/success-codes: "200"
spec: {selector: {app.kubernetes.io/name: grafana}, ports: [{name: http, port: 80, targetPort: http}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: postgres-exporter, namespace: signaltrade-staging}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: postgres-exporter}}
  template:
    metadata: {labels: {app.kubernetes.io/name: postgres-exporter}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65534, runAsGroup: 65534, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: postgres-exporter
          image: prometheuscommunity/postgres-exporter:v0.18.1
          ports: [{name: metrics, containerPort: 9187}]
          env:
            - {name: DATA_SOURCE_NAME, valueFrom: {secretKeyRef: {name: monitoring, key: POSTGRES_EXPORTER_DSN}}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          readinessProbe: {httpGet: {path: /metrics, port: metrics}, initialDelaySeconds: 5, periodSeconds: 10}
          resources: {requests: {cpu: 20m, memory: 32Mi}, limits: {cpu: 100m, memory: 128Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: postgres-exporter, namespace: signaltrade-staging}
spec: {selector: {app.kubernetes.io/name: postgres-exporter}, ports: [{name: metrics, port: 9187, targetPort: metrics}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: alloy, namespace: signaltrade-staging}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: alloy}}
  template:
    metadata: {labels: {app.kubernetes.io/name: alloy}}
    spec:
      serviceAccountName: alloy
      securityContext: {runAsNonRoot: true, runAsUser: 473, runAsGroup: 473, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: alloy
          image: grafana/alloy:v1.11.3
          args: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy", "/etc/alloy/config.alloy"]
          ports: [{name: http, containerPort: 12345}]
          volumeMounts:
            - {name: config, mountPath: /etc/alloy, readOnly: true}
            - {name: data, mountPath: /var/lib/alloy}
            - {name: tmp, mountPath: /tmp}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          readinessProbe: {httpGet: {path: /-/ready, port: http}, initialDelaySeconds: 10, periodSeconds: 10}
          resources: {requests: {cpu: 30m, memory: 64Mi}, limits: {cpu: 200m, memory: 192Mi}}
      volumes:
        - {name: config, configMap: {name: alloy-config}}
        - {name: data, emptyDir: {sizeLimit: 256Mi}}
        - {name: tmp, emptyDir: {medium: Memory, sizeLimit: 64Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: alloy, namespace: signaltrade-staging}
spec: {selector: {app.kubernetes.io/name: alloy}, ports: [{name: http, port: 12345, targetPort: http}]}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: observability-allow-required, namespace: signaltrade-staging}
spec:
  podSelector:
    matchExpressions:
      - {key: app.kubernetes.io/name, operator: In, values: [grafana, prometheus, loki, alloy, postgres-exporter]}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
        - ipBlock: {cidr: 172.31.0.0/16}
  egress:
    - to:
        - podSelector: {}
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - ipBlock: {cidr: 172.31.0.0/16}
      ports:
        - {protocol: TCP, port: 443}
        - {protocol: TCP, port: 5432}
    - to:
        - ipBlock: {cidr: 10.100.0.1/32}
      ports:
        - {protocol: TCP, port: 443}
