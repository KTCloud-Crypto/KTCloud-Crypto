apiVersion: v1
kind: Namespace
metadata:
  name: signaltrade-staging
  labels:
    app.kubernetes.io/part-of: signaltrade
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: signaltrade-secrets-manager
  namespace: signaltrade-staging
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: application
  namespace: signaltrade-staging
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: signaltrade-secrets-manager
  target:
    name: application
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: signaltrade/production
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: signaltrade-parameter-store
  namespace: signaltrade-staging
spec:
  provider:
    aws:
      service: ParameterStore
      region: us-east-1
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: monitoring
  namespace: signaltrade-staging
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: signaltrade-parameter-store
  target:
    name: monitoring
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: GRAFANA_ADMIN_USER
      remoteRef:
        key: /signaltrade/production/monitoring/grafana-admin-user
    - secretKey: GRAFANA_ADMIN_PASSWORD
      remoteRef:
        key: /signaltrade/production/monitoring/grafana-admin-password
    - secretKey: POSTGRES_EXPORTER_DSN
      remoteRef:
        key: /signaltrade/production/monitoring/postgres-exporter-dsn
