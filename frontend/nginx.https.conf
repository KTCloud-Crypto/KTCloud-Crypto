limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=sensitive_limit:10m rate=5r/m;

map $status $access_log_enabled {
    ~^[45] 1;
    default 0;
}

map $status $access_log_level {
    ~^5 ERROR;
    ~^4 WARNING;
    default INFO;
}

map $request_uri $request_path {
    ~^([^?]*) $1;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

log_format signaltrade_json escape=json
    '{"timestamp":"$time_iso8601","level":"$access_log_level",'
    '"log_type":"access","service":"frontend","environment":"${ENVIRONMENT}",'
    '"event":"nginx_request_completed","request_id":"$request_id",'
    '"client_ip":"$remote_addr","method":"$request_method","path":"$request_path",'
    '"status_code":$status,"request_time_seconds":$request_time,'
    '"bytes_sent":$bytes_sent,"request_length":$request_length,'
    '"upstream_status":"$upstream_status","upstream_response_time":"$upstream_response_time",'
    '"upstream_addr":"$upstream_addr","rate_limit_status":"$limit_req_status"}';

server {
    listen 80;
    listen [::]:80;
    server_name ${DOMAIN};
    server_tokens off;
    access_log /dev/stdout signaltrade_json if=$access_log_enabled;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${DOMAIN};
    resolver 127.0.0.11 valid=30s ipv6=off;
    server_tokens off;
    client_max_body_size 1m;
    access_log /dev/stdout signaltrade_json if=$access_log_enabled;

    ssl_certificate /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location = /api/metrics {
        access_log off;
        return 404;
    }

    location = /monitoring {
        auth_basic "SignalTrade Monitoring";
        auth_basic_user_file /run/secrets/monitoring_htpasswd;
        return 301 /monitoring/;
    }

    location /monitoring/ {
        auth_basic "SignalTrade Monitoring";
        auth_basic_user_file /run/secrets/monitoring_htpasswd;
        set $grafana_upstream http://grafana:3000;
        proxy_pass $grafana_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location /api/users/me/exchange-key {
        limit_req zone=sensitive_limit burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location /api/users/me/password {
        limit_req zone=sensitive_limit burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
